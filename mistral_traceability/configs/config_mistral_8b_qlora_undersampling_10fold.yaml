# Full 10-fold configuration. Full training is permitted only after the separate
# Fold 01 preflight report has status=passed and no errors.

experiment_id: "mistral_8b_qlora_undersampling"
experiment_name: "Ministral 3 8B QLoRA random undersampling 10-fold CV"

model:
  id: "mistralai/Ministral-3-8B-Instruct-2512-BF16"
  revision: "f6fae9795746f63c9be8344932f01275f3c63734"
  class_name: "Mistral3ForConditionalGeneration"
  local_files_only: true
  fix_mistral_regex: true

data:
  balancing: "random_undersampling_without_replacement"
  qwen_data_root: "data/qwen35_oversampling_10fold_cv"
  mistral_test_root: "mistral_traceability/data/folds"
  manifest_file: "mistral_traceability/data/manifests/mistral_8b_qlora_undersampling_folds.json"
  recreate_splits: false
  undersampling:
    method: "random_sample_without_replacement"
    majority_class: "no_trace"
    target_rule: "match_inner_train_minority_count"
    seed_base: 42
    seed_rule: "seed_base_plus_fold_number"
    shuffle_after_resampling: true
    use_frozen_files: true
    regenerate: false

prompt:
  protocol: "exact_qwen35_exp07_pattern1_no_chat_template"
  chat_template: false
  loss_scope: "full_prompt_and_label"
  labels:
    - "trace"
    - "no_trace"

training:
  learning_rate: 0.00005
  batch_size: 1
  gradient_accumulation_steps: 8
  effective_batch_size: 8
  num_epochs: 2
  max_steps: null
  warmup_steps: 20
  max_grad_norm: 1.0
  weight_decay: 0.01
  fp16: false
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  max_length: 1024
  num_workers: 0
  seed: 42
  optimizer: "AdamW"
  scheduler: "linear_with_warmup"
  dataloader_shuffle: false
  partial_accumulation_policy: "discard_incomplete_accumulation_at_each_epoch_historical_exp07"
  expected_train_microbatches_by_fold:
    fold_01: 1226
    fold_02: 1226
    fold_03: 1226
    fold_04: 1226
    fold_05: 1226
    fold_06: 1226
    fold_07: 1226
    fold_08: 1228
    fold_09: 1228
    fold_10: 1228
  expected_optimizer_steps_per_epoch: 153
  expected_completed_optimizer_steps_per_fold: 306
  scheduler_total_steps_by_fold:
    fold_01: 306
    fold_02: 306
    fold_03: 306
    fold_04: 306
    fold_05: 306
    fold_06: 306
    fold_07: 306
    fold_08: 307
    fold_09: 307
    fold_10: 307

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules_regex: '.*language_model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)'
  expected_adapter_modules: 136
  expected_trainable_parameters: 14483456

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  compute_dtype: "bfloat16"
  double_quant: true

validation:
  eval_steps: 50
  eval_samples: 100
  compute_perplexity: true

evaluation:
  base_model_precision: "bfloat16"
  max_new_tokens: 5
  max_length: 1024
  do_sample: false
  labels_order:
    - "trace"
    - "no_trace"
  invalid_prediction_policy: "exclude_from_classification_metrics"

checkpointing:
  save_steps: 100
  save_total_limit: 3
  best_model_criterion: "lowest_epoch_training_loss_historical_exp07"
  resume_from_checkpoint: null

logging:
  logging_steps: 10
  log_root: "mistral_traceability/logs/mistral_8b_qlora_undersampling"

paths:
  output_root: "mistral_traceability/outputs/mistral_8b_qlora_undersampling"
  result_root: "mistral_traceability/results/mistral_8b_qlora_undersampling"

protocol_provenance:
  qwen_experiment: "EXP-07 Qwen3.5-9B QLoRA undersampling"
  qwen_reference_commit: "55c82a5"
  qwen_training_implementation_commit: "198fc2f"
  qwen_evaluation_implementation_commit: "a99a99f"
  qwen_config_generator: "scripts/create_qwen35_inner_val_undersampling_fold_config.py"
  qwen_undersampling_implementation: "scripts/create_undersampled_inner_train_fold.py"
  frozen_split_policy: "validate_existing_files_never_regenerate"
