experiment_id: "mistral_8b_qlora_unbalanced"
experiment_name: "Ministral QLoRA original imbalanced distribution"
fold: 1

model:
  id: "mistralai/Ministral-3-8B-Instruct-2512-BF16"
  revision: "f6fae9795746f63c9be8344932f01275f3c63734"
  class_name: "Mistral3ForConditionalGeneration"
  local_files_only: true
  fix_mistral_regex: true

data:
  balancing: "none_original_imbalanced_inner_train"
  train_file: "data/qwen35_oversampling_10fold_cv/inner_splits/fold_01/inner_train.jsonl"
  validation_file: "data/qwen35_oversampling_10fold_cv/inner_splits/fold_01/validation.jsonl"
  test_file: "mistral_traceability/data/folds/fold_01/test.jsonl"
  qwen_reference_test_file: "data/qwen35_oversampling_10fold_cv/folds/fold_01/test.jsonl"
  expected:
    train:
      records: 1528
      trace: 613
      no_trace: 915
      sha256: "36bcf24b7669d744e93b41449da8ea608bc87c72ea2663e9a842928f689dd34d"
    validation:
      records: 170
      trace: 68
      no_trace: 102
      sha256: "c665db59d17a69f0fa56b1760eb0f46f3dd6ec396047b0ec6a7aae0bb7aaad4c"
    test:
      records: 189
      trace: 76
      no_trace: 113
      sha256: "69d14e206beb6d32842297ad63e73ac55b412251a8a32c36cb03db7afbb50977"

prompt:
  protocol: "exact_qwen35_exp08_pattern1_no_chat_template"
  chat_template: false
  loss_scope: "full_prompt_and_label"
  labels:
    - "trace"
    - "no_trace"

training:
  learning_rate: 0.00005
  batch_size: 1
  gradient_accumulation_steps: 8
  num_epochs: 2
  max_steps: null
  warmup_steps: 20
  max_grad_norm: 1.0
  weight_decay: 0.01
  fp16: false
  bf16: true
  gradient_checkpointing: true
  gradient_checkpointing_use_reentrant: false
  max_length: 1024
  num_workers: 0
  seed: 42
  optimizer: "AdamW"
  scheduler: "linear_with_warmup"
  dataloader_shuffle: false

lora:
  r: 16
  alpha: 32
  dropout: 0.1
  bias: "none"
  task_type: "CAUSAL_LM"
  target_modules_regex: '.*language_model\.layers\.\d+\.self_attn\.(q_proj|k_proj|v_proj|o_proj)'
  expected_adapter_modules: 136
  expected_trainable_parameters: 14483456

quantization:
  load_in_4bit: true
  quant_type: "nf4"
  compute_dtype: "bfloat16"
  double_quant: true

evaluation:
  eval_steps: 50
  eval_samples: 100
  compute_perplexity: true
  max_new_tokens: 5
  do_sample: false

checkpointing:
  save_steps: 100
  save_total_limit: 3

logging:
  logging_steps: 10
  log_file: "mistral_traceability/logs/mistral_8b_qlora_unbalanced/preflight_fold_01.log"
  report_file: "mistral_traceability/results/mistral_8b_qlora_unbalanced/preflight/fold_01/preflight_report.json"

preflight:
  run_one_optimizer_step: true
  stress_longest_training_sequence: true
  save_adapter: false
