# FT Pipeline Configuration
# Configuration for Fine-Tuning using LoRA variants
# Part of the full training pipeline: KD - LoRA/FT - RLHF - PEFT - PTQ


# MODEL CONFIGURATION


# Base model to fine-tune
# Can be HuggingFace model ID or local path
model_path: "/models/Qwen3.5-35B-A3B-Base"

# MLflow model loading: load KD output model
use_mlflow_model: true
mlflow_experiment_name: "KD_Distillation"
mlflow_run_name: "latest"


# FINE-TUNING METHOD


# Method to use:
#   - "lora": Standard LoRA (Hu et al. 2021)
#   - "qlora": QLoRA - 4-bit quantized base (Dettmers et al. 2023)
#   - "dora": DoRA - Magnitude+direction decomposition (Zhang et al. 2024)
#   - "loraplus": LoRA+ - Distinct A/B learning rates (arXiv:2402.12354)
method: "qlora"


# TRAINING HYPERPARAMETERS


training:
  # Learning rate
  # For models >13B with QLoRA, use 1e-4
  learning_rate: 1.0e-4

  # Batch size and gradient accumulation
  batch_size: 2
  gradient_accumulation_steps: 16
  # Effective batch size = 2 * 16 = 32

  # Training duration
  # Research (2024): 1-3 epochs recommended, 1-2 often sufficient
  # 3 epochs increases overfitting risk, especially on smaller datasets
  num_epochs: 2
  max_steps: null  # If set, overrides num_epochs

  # Warmup and gradient clipping
  warmup_steps: 100
  max_grad_norm: 1.0
  weight_decay: 0.01

  # Mixed precision
  fp16: false      # Use FP16 (can cause NaN)
  bf16: true       # Use BF16 (recommended for stability)

  # Advanced options
  gradient_checkpointing: true  # Required for 35B model to fit in VRAM


# LORA CONFIGURATION


lora:
  enabled: true

  # LoRA rank (r)
  # Low (r=8): Fast, less capacity, good for small datasets
  # Medium (r=16): Standard choice, balanced
  # High (r=32-64): More capacity, better for complex tasks
  r: 16

  # LoRA alpha (scaling factor)
  # Typical: alpha = 2 * r
  # r=16 - alpha=32 (standard)
  alpha: 32

  # LoRA dropout (regularization)
  # Research (2024): LoRA dropout not that useful, defaults to 0
  # Use 0 for best performance, or 0.05-0.1 for very small datasets
  dropout: 0.0

  # Target modules (which layers to adapt)
  # Research (2024): Targeting all layers performs best (QLoRA-All)
  # Attention: [q_proj, k_proj, v_proj, o_proj]
  # FFN/MLP: [gate_proj, up_proj, down_proj]
  # Full coverage provides 3-4% performance gain vs attention-only
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

  # LoRA variants (optional)
  use_dora: false    # DoRA: Magnitude+direction decomposition
  use_rslora: false  # rsLoRA: Rank-stabilized LoRA


# QUANTIZATION (for QLoRA)


quantization:
  # Enable 4-bit quantization (for QLoRA method)
  enabled: true

  # Quantization type: nf4 (recommended) or fp4
  # NF4: Information-theoretically optimal 4-bit format
  type: "nf4"

  # Compute dtype: bfloat16 (recommended) or float16
  compute_dtype: "bfloat16"

  # Double quantization: Quantize the quantization constants
  # Saves additional memory with minimal quality loss
  double_quant: true


# DATA CONFIGURATION


data:
  # Training dataset - per-agent JSONL files in chat format (messages column)
  # Run FT once per agent, overriding dataset_name with the agent JSONL:
  #   --data.dataset_name /data/datasets/generic/codegen_agent.jsonl
  # Available agents: elicit, architecture, taskgen, codegen, quality, testgen, deployment, maintain
  dataset_name: "/data/datasets/generic/codegen_agent.jsonl"
  dataset_split: "train"

  # Maximum number of training samples (null = use all)
  max_samples: null  # Use all samples from the agent JSONL (typically ~1000 each)

  # Sequence length
  max_length: 512

  # Preprocessing
  num_workers: 0  # Must be 0 on Windows (multiprocessing limitation)


# EVALUATION


evaluation:
  # Evaluation frequency
  eval_steps: 500      # Evaluate every N steps
  eval_samples: 500    # Number of samples for evaluation (higher = more stable metrics)

  # Evaluation dataset (can differ from training)
  eval_dataset: "wikitext"
  eval_split: "validation"

  # Metrics to compute
  compute_perplexity: true


# CHECKPOINTING & LOGGING


checkpointing:
  # Output directory for checkpoints
  output_dir: ./checkpoints/ft

  # Checkpoint frequency
  save_steps: 1000
  save_total_limit: 3  # Keep only last N checkpoints

  # Resume from checkpoint (set path or null)
  resume_from_checkpoint: null

logging:
  # Logging frequency
  logging_steps: 10

  # Log level: DEBUG, INFO, WARNING, ERROR
  log_level: INFO

  # Weights & Biases (optional)
  wandb_enabled: false
  wandb_project: "llm-ft"
  wandb_entity: null  # Your W&B username/organization
  wandb_run_name: null  # Auto-generated if null


# DEVICE & PERFORMANCE


device:
  # Device allocation: "auto", "cuda", "cpu"
  device: "auto"


# ADVANCED OPTIONS


advanced:
  # Seed for reproducibility
  seed: 42


# NOTES


# Key Differences from KD Pipeline:
# - NO teacher model (single model only)
# - NO temperature parameter (no distillation)
# - NO alpha parameter (no KD loss weighting)
# - Pure supervised learning (CE loss only)

# Memory Requirements:
# - Standard LoRA (FP16): ~2× model size
# - QLoRA (4-bit): ~0.5× model size
# Examples:
#   - Qwen3-0.6B LoRA: ~2GB VRAM
#   - Qwen3-0.6B QLoRA: ~1GB VRAM
#   - Qwen3-1.7B LoRA: ~5GB VRAM
#   - Qwen3-1.7B QLoRA: ~2GB VRAM

# Recommended Settings:
# 1. Quick test (1000 steps, 10 minutes):
#    max_samples: 5000, num_epochs: 1, eval_steps: 200
#
# 2. Standard training (5000 steps, 1-2 hours):
#    max_samples: 50000, num_epochs: 3, eval_steps: 500
#
# 3. Full training (20000 steps, 5-10 hours):
#    max_samples: 200000, num_epochs: 3, eval_steps: 1000
